name = "check"
defaultTargets = ["verekos-check"]

# The model, pinned to one commit of this repository and cloned under
# .lake/packages/world (subDir world). Not a path dependency: a path
# dependency builds inside world/, which the world lane owns and edits live.
# Its dependencies (minidregg and the Mathlib family) are symlinks under
# .lake/packages to the same checkouts world/ uses; nothing is downloaded.
[[require]]
name = "world"
git = "/Users/ember/dev/verekos"
rev = "833eae5e9d24ad2a291172f209bd86ee1a480dfa"
subDir = "world"

# The runner: the untrusted parsers and mappers. It imports the model only
# through WorldCore, world's Mathlib-free library, so the executable never
# compiles or links Mathlib, and it copies no model definition.
[[lean_lib]]
name = "Check"

[[lean_exe]]
name = "verekos-check"
root = "Main"
