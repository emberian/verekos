name = "map"
defaultTargets = ["verekos-map", "MapProofs"]

# The model, pinned to one commit of this repository and cloned under
# .lake/packages/world (subDir world), as check/ does: a path dependency would
# build inside world/, which the world lane owns. Its dependencies (minidregg,
# and the Mathlib family that nothing here imports) are a local clone and
# symlinks under .lake/packages; nothing is downloaded.
[[require]]
name = "world"
git = "/Users/ember/dev/verekos"
rev = "79b044570f273cdfb8cea996b93e3fc741846eed"
subDir = "world"

# The mapper: imports only WorldCore modules (World.Document, World.Shapes),
# minidregg's Pred.Core and Compiler.Sha256, and Lean's JSON reader, so the
# executable never compiles or links Mathlib.
[[lean_lib]]
name = "VerekosMap"

# minidregg's evaluator run on the generated laws (R2, R3 and controls).
# Built, never linked.
[[lean_lib]]
name = "MapProofs"

[[lean_exe]]
name = "verekos-map"
root = "Main"
